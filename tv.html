<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pano TV Ekranı</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mediaContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-item {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        .media-item.active {
            display: block;
        }

        /* ALT NOT BANT STİLİ */
        #noteBar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 15px 25px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
            z-index: 10;
            display: none;
            border-top: 2px solid #4CAF50;
        }

        #emptyMessage {
            font-size: 28px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="mediaContainer">
    <div id="emptyMessage">Yansıtılan içerik bekleniyor...</div>
    <img id="imgDisplay" class="media-item" alt="Ekran Görseli">
    <video id="videoDisplay" class="media-item" autoplay muted playsinline></video>
    <div id="noteBar"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBFI-d8Hg3Z-FmDoc6CKz5Regx3PMA11lo",
      authDomain: "deneme-fe19a.firebaseapp.com",
      databaseURL: "https://deneme-fe19a-default-rtdb.firebaseio.com",
      projectId: "deneme-fe19a"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const imgDisplay = document.getElementById('imgDisplay');
    const videoDisplay = document.getElementById('videoDisplay');
    const emptyMessage = document.getElementById('emptyMessage');
    const noteBar = document.getElementById('noteBar');

    let currentImages = [];
    let currentIndex = 0;
    let slideTimer = null;
    const DEFAULT_IMAGE_DURATION = 5000; // Fotoğraflar için varsayılan 5 saniye

    // Firebase Verilerini Dinle
    db.ref('displayData').on('value', (snapshot) => {
        const data = snapshot.val();
        
        if (!data) {
            ekraniTemizle();
            return;
        }

        // Ekran Notunu Göster
        if (data.note && data.note.trim() !== "") {
            noteBar.innerText = data.note;
            noteBar.style.display = "block";
        } else {
            noteBar.style.display = "none";
        }

        // Medyaları Güncelle
        if (data.images && data.images.length > 0) {
            currentImages = data.images;
            currentIndex = 0;
            emptyMessage.style.display = "none";
            medyaOynat();
        } else {
            if (!data.note || data.note.trim() === "") {
                ekraniTemizle();
            } else {
                imgDisplay.style.display = "none";
                videoDisplay.style.display = "none";
                emptyMessage.style.display = "none";
            }
        }
    });

    function medyaOynat() {
        if (slideTimer) clearTimeout(slideTimer);

        if (currentImages.length === 0) return;

        const currentMedia = currentImages[currentIndex];
        const isVideo = currentMedia.startsWith('data:video');

        if (isVideo) {
            imgDisplay.style.display = "none";
            videoDisplay.src = currentMedia;
            videoDisplay.style.display = "block";

            // Sadece TEK VİDEO seçilmişse döngüye sok (loop)
            if (currentImages.length === 1) {
                videoDisplay.loop = true;
                videoDisplay.play().catch(e => console.log("Oynatma hatası:", e));
            } else {
                // Birden fazla medya varsa video bitince sıradakine geç
                videoDisplay.loop = false;
                videoDisplay.play().catch(e => console.log("Oynatma hatası:", e));
                
                videoDisplay.onended = () => {
                    sonrakiMedyayaGec();
                };
            }
        } else {
            // Görsel Oynatma
            videoDisplay.pause();
            videoDisplay.style.display = "none";
            imgDisplay.src = currentMedia;
            imgDisplay.style.display = "block";

            // Birden fazla resim/medya varsa belirlenen süre sonunda sıradakine geç
            if (currentImages.length > 1) {
                slideTimer = setTimeout(() => {
                    sonrakiMedyayaGec();
                }, DEFAULT_IMAGE_DURATION);
            }
        }
    }

    function sonrakiMedyayaGec() {
        currentIndex = (currentIndex + 1) % currentImages.length;
        medyaOynat();
    }

    function ekraniTemizle() {
        imgDisplay.style.display = "none";
        videoDisplay.style.display = "none";
        noteBar.style.display = "none";
        emptyMessage.style.display = "block";
        if (slideTimer) clearTimeout(slideTimer);
    }
</script>

</body>
</html>
