<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pano Slayt Ekranı</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #loginBox {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
            z-index: 10;
        }
        input[type="password"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            text-align: center;
            margin-bottom: 15px;
            width: 80%;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        
        #mainContent {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }

        #noteDisplay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 25px;
            border-radius: 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            max-width: 90%;
            word-wrap: break-word;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* GEÇİŞ EFEKTİ AYARLARI */
        .media-element {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center;
            border: none;
            margin: 0;
            padding: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out; /* 0.8 saniyelik yumuşak geçiş */
            pointer-events: none;
        }

        .media-element.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="loginBox">
        <h2>Pano Ekranı Girişi</h2>
        <input type="password" id="pinInput" placeholder="PIN Şifrenizi Girin">
        <br>
        <button onclick="girisYap()">Giriş Yap</button>
        <p id="errorMsg" style="color: #ff5252; margin-top: 10px; display: none;">Hatalı Şifre!</p>
    </div>

    <div id="mainContent">
        <div id="noteDisplay">Pano Hazır...</div>
        <img id="imageDisplay" class="media-element" src="" alt="Resim">
        <video id="videoDisplay" class="media-element" autoplay muted playsinline></video>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const KORUMA_SIFRESI = "2525";

        const firebaseConfig = {
          apiKey: "AIzaSyBFI-d8Hg3Z-FmDoc6CKz5Regx3PMA11lo",
          authDomain: "deneme-fe19a.firebaseapp.com",
          databaseURL: "https://deneme-fe19a-default-rtdb.firebaseio.com",
          projectId: "deneme-fe19a"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let mediaList = [];
        let currentIndex = 0;
        let slideTimeout = null;

        function girisYap() {
            const girilen = document.getElementById('pinInput').value;
            if (girilen === KORUMA_SIFRESI) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
                var elem = document.documentElement;
                if (elem.requestFullscreen) { elem.requestFullscreen(); }
                else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
                else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }

                panoyuBaslat();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function panoyuBaslat() {
            db.ref('displayData').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const noteElem = document.getElementById('noteDisplay');
                    if (data.note) {
                        noteElem.innerText = data.note;
                        noteElem.style.display = 'block';
                    } else {
                        noteElem.style.display = 'none';
                    }

                    if (data.images && data.images.length > 0) {
                        mediaList = data.images;
                        currentIndex = 0;
                        baslatSlayt();
                    } else {
                        mediaList = [];
                        if (slideTimeout) clearTimeout(slideTimeout);
                        document.getElementById('imageDisplay').classList.remove('active');
                        document.getElementById('videoDisplay').classList.remove('active');
                    }
                }
            });
        }

        function baslatSlayt() {
            if (slideTimeout) clearTimeout(slideTimeout);
            const imgElem = document.getElementById('imageDisplay');
            const videoElem = document.getElementById('videoDisplay');

            function gosterNextMedya() {
                if (mediaList.length === 0) return;

                const currentItem = mediaList[currentIndex];
                currentIndex = (currentIndex + 1) % mediaList.length;

                if (currentItem.startsWith('data:video')) {
                    // Videoya geçerken resmi yumuşakça gizle
                    imgElem.classList.remove('active');

                    videoElem.src = currentItem;
                    videoElem.onloadeddata = () => {
                        videoElem.classList.add('active');
                        videoElem.play().catch(e => console.log(e));
                    };

                    videoElem.onended = () => {
                        gosterNextMedya();
                    };
                } else {
                    // Fotoğrafa geçerken videoyu durdur ve yumuşakça gizle
                    videoElem.pause();
                    videoElem.classList.remove('active');

                    imgElem.src = currentItem;
                    imgElem.onload = () => {
                        imgElem.classList.add('active');
                    };

                    // Fotoğraflar ekranda 5 saniye kalır
                    slideTimeout = setTimeout(gosterNextMedya, 5000);
                }
            }

            gosterNextMedya();
        }
    </script>
</body>
</html>
