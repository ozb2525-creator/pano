<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Pano TV Ekranı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #mediaContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #000;
            overflow: hidden;
        }

        /* Otomatik Bulanık Arka Plan Katmanı */
        .bg-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(25px) brightness(0.5);
            -webkit-filter: blur(25px) brightness(0.5);
            transform: scale(1.1);
            z-index: 1;
            display: none;
        }

        /* Öndeki Orijinal Medya */
        .media-item {
            position: relative;
            z-index: 2;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        #loginBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.9);
        }

        #loginBox h3 {
            margin-bottom: 15px;
            color: #4CAF50;
            font-size: 20px;
        }

        #pinInput {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 18px;
            text-align: center;
            margin-bottom: 12px;
        }

        #loginBtn {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #loginError {
            color: #ff5252;
            display: none;
            margin-top: 10px;
            font-size: 14px;
        }

        /* Sağ Üst Kontrol Alanı (Şarj & Tam Ekran) */
        #topRightControls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #batteryBox {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #666;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            display: none; /* Şarj bilgisi alınınca açılır */
        }

        #fsBtn {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #666;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        #noteBar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 20px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            z-index: 10;
            display: none;
            border-top: 3px solid #4CAF50;
        }

        #emptyMessage {
            position: relative;
            z-index: 2;
            font-size: 24px;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- ŞİFRE GİRİŞ KUTUSU -->
<div id="loginBox">
    <h3>TV Ekranı Girişi</h3>
    <input type="password" id="pinInput" placeholder="Erişim Şifresi">
    <button id="loginBtn" onclick="girisYap()">Yayını Başlat</button>
    <p id="loginError">Hatalı Şifre!</p>
</div>

<!-- MEDYA EKRANI -->
<div id="mediaContainer" style="display:none;">
    <div id="topRightControls">
        <div id="batteryBox">🔋 %--</div>
        <button id="fsBtn" onclick="tamEkranYap()">⛶ Tam Ekran</button>
    </div>
    
    <!-- Arka Plan Bulanıklığı Katmanı -->
    <img id="bgDisplay" class="bg-blur" alt="Bulanık Arka Plan">

    <div id="emptyMessage">Yansıtılan içerik bekleniyor...</div>
    <img id="imgDisplay" class="media-item" alt="Ekran Görseli">
    <video id="videoDisplay" class="media-item" autoplay muted playsinline preload="auto"></video>
    <div id="noteBar"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    var KORUMA_SIFRESI = "2525";

    var firebaseConfig = {
      apiKey: "AIzaSyBFI-d8Hg3Z-FmDoc6CKz5Regx3PMA11lo",
      authDomain: "deneme-fe19a.firebaseapp.com",
      databaseURL: "https://deneme-fe19a-default-rtdb.firebaseio.com",
      projectId: "deneme-fe19a"
    };

    var db = null;
    var imgDisplay = document.getElementById('imgDisplay');
    var bgDisplay = document.getElementById('bgDisplay');
    var videoDisplay = document.getElementById('videoDisplay');
    var emptyMessage = document.getElementById('emptyMessage');
    var noteBar = document.getElementById('noteBar');

    var currentImages = [];
    var currentIndex = 0;
    var slideTimer = null;
    var DEFAULT_IMAGE_DURATION = 5000;

    function girisYap() {
        var girilen = document.getElementById('pinInput').value;
        var errorElem = document.getElementById('loginError');

        if (girilen === KORUMA_SIFRESI) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('mediaContainer').style.display = 'flex';
            
            // Otomatik tam ekrana geç
            tamEkranYap();
            
            // Batarya takibini başlat
            bataryaBilgisiBaslat();

            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            
            verileriDinle();
        } else {
            errorElem.style.display = 'block';
        }
    }

    function tamEkranYap() {
        var elem = document.documentElement;
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
        } else if (elem.mozRequestFullScreen) {
            elem.mozRequestFullScreen();
        } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
        }
    }

    // Tabletin şarj seviyesini canlı takip eden fonksiyon
    function bataryaBilgisiBaslat() {
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function bataryaGuncelle() {
                    var seviye = Math.round(battery.level * 100);
                    var sarjdaMi = battery.charging;
                    var batteryElem = document.getElementById('batteryBox');
                    
                    if (batteryElem) {
                        var simge = sarjdaMi ? "⚡" : "🔋";
                        batteryElem.innerText = simge + " %" + seviye;
                        batteryElem.style.display = "block";
                    }
                }

                // İlk yüklemede güncelle
                bataryaGuncelle();

                // Şarj seviyesi veya kablo durumu değiştikçe güncelle
                battery.addEventListener('levelchange', bataryaGuncelle);
                battery.addEventListener('chargingchange', bataryaGuncelle);
            }).catch(function(err) {
                console.log("Batarya bilgisi alınamadı:", err);
            });
        }
    }

    function verileriDinle() {
        db.ref('displayData').on('value', function(snapshot) {
            var data = snapshot.val();
            
            if (!data) {
                ekraniTemizle();
                return;
            }

            if (data.note && data.note.trim() !== "") {
                noteBar.innerText = data.note;
                noteBar.style.display = "block";
            } else {
                noteBar.style.display = "none";
            }

            if (data.images && data.images.length > 0) {
                currentImages = data.images;
                currentIndex = 0;
                emptyMessage.style.display = "none";
                medyaOynat();
            } else {
                if (!data.note || data.note.trim() === "") {
                    ekraniTemizle();
                } else {
                    bgDisplay.style.display = "none";
                    imgDisplay.style.display = "none";
                    videoDisplay.style.display = "none";
                    emptyMessage.style.display = "none";
                }
            }
        });
    }

    function medyaOynat() {
        if (slideTimer) clearTimeout(slideTimer);

        if (currentImages.length === 0) return;

        var currentMedia = currentImages[currentIndex];
        var isVideo = currentMedia.indexOf('data:video') === 0;

        if (isVideo) {
            bgDisplay.style.display = "none";
            imgDisplay.style.display = "none";
            videoDisplay.style.display = "block";
            
            videoDisplay.src = currentMedia;
            videoDisplay.load();

            if (currentImages.length === 1) {
                videoDisplay.loop = true;
            } else {
                videoDisplay.loop = false;
                videoDisplay.onended = function() {
                    sonrakiMedyayaGec();
                };
            }

            var playPromise = videoDisplay.play();
            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    videoDisplay.muted = true;
                    videoDisplay.play();
                });
            }
        } else {
            videoDisplay.pause();
            videoDisplay.style.display = "none";

            bgDisplay.src = currentMedia;
            bgDisplay.style.display = "block";

            imgDisplay.src = currentMedia;
            imgDisplay.style.display = "block";

            if (currentImages.length > 1) {
                slideTimer = setTimeout(function() {
                    sonrakiMedyayaGec();
                }, DEFAULT_IMAGE_DURATION);
            }
        }
    }

    function sonrakiMedyayaGec() {
        currentIndex = (currentIndex + 1) % currentImages.length;
        medyaOynat();
    }

    function ekraniTemizle() {
        bgDisplay.style.display = "none";
        imgDisplay.style.display = "none";
        videoDisplay.style.display = "none";
        noteBar.style.display = "none";
        emptyMessage.style.display = "block";
        if (slideTimer) clearTimeout(slideTimer);
    }
</script>

</body>
</html>
