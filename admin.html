<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pano Yönetimi - Admin</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --primary: #6366f1;
      --danger: #ef4444;
      --text: #f3f4f6;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h2, h3 {
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #a1a1aa;
    }
    select, input[type="text"], input[type="range"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #09090b;
      color: #fff;
      font-size: 0.95rem;
    }
    .range-val {
      float: right;
      color: var(--primary);
      font-weight: bold;
    }
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    
    /* Fotoğraf Galerisi & Önizleme */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }
    .preview-item {
      position: relative;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #3f3f46;
    }
    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(239, 68, 68, 0.85);
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <h2>Dijital Pano Yönetimi</h2>

  <!-- 1. FOTOĞRAF SEÇME VE YANSITMA -->
  <div class="card">
    <h3>Fotoğraf Seç & Yansıt</h3>
    <div class="form-group">
      <label>Cihazdan Fotoğraf(lar) Seç:</label>
      <input type="file" id="imageInput" accept="image/*" multiple onchange="handleFileSelect(event)">
    </div>
    
    <div class="preview-grid" id="previewGrid">
      <!-- Yüklenen görseller burada görünecek -->
    </div>
  </div>

  <!-- 2. SLAYT VE GEÇİŞ AYARLARI -->
  <div class="card">
    <h3>Slayt & Geçiş Ayarları</h3>
    
    <div class="form-group">
      <label>
        Slayt Geçiş Süresi 
        <span class="range-val" id="duration-val">5 saniye</span>
      </label>
      <input type="range" id="duration" min="2" max="30" value="5" oninput="document.getElementById('duration-val').innerText = this.value + ' saniye'">
    </div>

    <div class="form-group">
      <label>Geçiş Efekti Stili</label>
      <select id="effect">
        <option value="fade">Yumuşak Geçiş (Fade)</option>
        <option value="slide">Yana Kayma (Slide)</option>
        <option value="zoom">Yakınlaşma (Zoom)</option>
        <option value="kenburns">Ken Burns (Pan & Zoom)</option>
      </select>
    </div>

    <div class="form-group toggle-group">
      <label for="shuffle">Fotoğrafları Karışık Oynat (Shuffle)</label>
      <input type="checkbox" id="shuffle" style="width: 20px; height: 20px;">
    </div>
  </div>

  <!-- 3. EK BANNER & NOT -->
  <div class="card">
    <h3>Ekran İçeriği & Not</h3>
    <div class="form-group">
      <label>Alt Kayar Not / Duyuru Bandı</label>
      <input type="text" id="ticker" placeholder="Örn: Akşam saat 20:00'de spora gidilecek!">
    </div>
  </div>

  <button class="btn" onclick="publishToTV()">Yayını ve Ayarları TV'ye Gönder</button>

  <script>
    let imageList = [];

    // Dosya seçildiğinde yerel tarayıcı hafızasında Base64 formatına çevirip saklar
    function handleFileSelect(event) {
      const files = event.target.files;
      if (!files.length) return;

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          imageList.push(e.target.result);
          renderPreview();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPreview() {
      const grid = document.getElementById('previewGrid');
      grid.innerHTML = '';
      imageList.forEach((src, index) => {
        const div = document.createElement('div');
        div.className = 'preview-item';
        div.innerHTML = `
          <img src="${src}" />
          <button class="delete-btn" onclick="removeImage(${index})">✕</button>
        `;
        grid.appendChild(div);
      });
    }

    function removeImage(index) {
      imageList.splice(index, 1);
      renderPreview();
    }

    function publishToTV() {
      const payload = {
        images: imageList,
        interval: parseInt(document.getElementById('duration').value) * 1000,
        effect: document.getElementById('effect').value,
        shuffle: document.getElementById('shuffle').checked,
        tickerText: document.getElementById('ticker').value
      };

      // BroadcastChannel kullanarak tarayıcılar arası / sekmeler arası anlık senkronizasyon
      const channel = new BroadcastChannel('tv_board_channel');
      channel.postMessage(payload);

      alert('Yayın ve ayarlar TV ekranına başarıyla gönderildi!');
    }
  </script>
</body>
</html>
