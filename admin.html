<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pano Admin Paneli</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        h2 { text-align: center; margin-bottom: 20px; color: #4CAF50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 14px;
        }
        textarea { resize: vertical; height: 80px; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover { background-color: #45a049; }
        .btn-reset { background-color: #ff9800; }
        .btn-reset:hover { background-color: #e68a00; }
        .btn-logout { background-color: #e53935; }
        .btn-logout:hover { background-color: #d32f2f; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
        
        #progressContainer {
            width: 100%;
            background-color: #2a2a2a;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            overflow: hidden;
            border: 1px solid #333;
        }
        #progressBar {
            width: 0%;
            height: 22px;
            background-color: #4CAF50;
            text-align: center;
            line-height: 22px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            transition: width 0.2s ease-in-out;
        }

        #panelContent { display: none; }
        #loginBox { text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pano Yönetim Paneli</h2>

    <!-- 1. ADIM: ŞİFRE GİRİŞ KUTUSU -->
    <div id="loginBox">
        <div class="form-group">
            <label for="pinInput">Yönetici Şifresi:</label>
            <input type="password" id="pinInput" placeholder="Şifrenizi Girin">
        </div>
        <button onclick="girisYap()">Giriş Yap</button>
        <p id="loginError" style="color: #ff5252; display: none; margin-top: 10px;">Hatalı Şifre!</p>
    </div>

    <!-- 2. ADIM: YANSITMA PANELİ -->
    <div id="panelContent">
        <div class="form-group">
            <label for="noteInput">Ekran Notu (İsteğe Bağlı):</label>
            <textarea id="noteInput" placeholder="Ekranda görünecek notu yazın..."></textarea>
        </div>

        <div class="form-group">
            <label for="fileInput">Fotoğraf veya Video Seç:</label>
            <input type="file" id="fileInput" accept="image/*,video/*" multiple>
            <small style="color: #aaa; display: block; margin-top: 5px;">Büyük videolar sınır dâhilinde otomatik kesilir.</small>
        </div>

        <button onclick="yansit()">Slaytı Ekrana Yansıt</button>
        <button onclick="secimleriSifirla()" class="btn-reset">Seçimleri Sıfırla</button>
        <button onclick="cikisYap()" class="btn-logout">Çıkış Yap</button>
        
        <div id="progressContainer">
            <div id="progressBar">0%</div>
        </div>

        <div id="status"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const KORUMA_SIFRESI = "2525";

    const firebaseConfig = {
      apiKey: "AIzaSyBFI-d8Hg3Z-FmDoc6CKz5Regx3PMA11lo",
      authDomain: "deneme-fe19a.firebaseapp.com",
      databaseURL: "https://deneme-fe19a-default-rtdb.firebaseio.com",
      projectId: "deneme-fe19a"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function girisYap() {
        const girilen = document.getElementById('pinInput').value;
        const errorElem = document.getElementById('loginError');

        if (girilen === KORUMA_SIFRESI) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('panelContent').style.display = 'block';
            errorElem.style.display = 'none';
        } else {
            errorElem.style.display = 'block';
        }
    }

    function secimleriSifirla() {
        document.getElementById('fileInput').value = '';
        document.getElementById('noteInput').value = '';
        document.getElementById('progressContainer').style.display = 'none';
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressBar').innerText = '0%';
        const status = document.getElementById('status');
        status.style.color = "#ffeb3b";
        status.innerText = "Seçimler ve not temizlendi.";
        setTimeout(() => { status.innerText = ''; }, 2000);
    }

    function cikisYap() {
        document.getElementById('pinInput').value = '';
        secimleriSifirla();
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('panelContent').style.display = 'none';
        document.getElementById('status').innerText = '';
    }

    // Videoyu sorunsuz şekilde kırpan fonksiyon
    function cropVideoFile(file, maxMb) {
        return new Promise((resolve, reject) => {
            const video = document.createElement('video');
            video.src = URL.createObjectURL(file);
            video.muted = true;
            video.playsInline = true;

            video.onloadedmetadata = () => {
                const duration = video.duration;
                const targetBytes = maxMb * 1024 * 1024;
                const allowedRatio = targetBytes / file.size;
                const cropDuration = Math.max(2, duration * allowedRatio);

                const stream = video.captureStream ? video.captureStream() : video.mozCaptureStream();
                
                let mimeType = 'video/webm';
                if (MediaRecorder.isTypeSupported('video/mp4;codecs=h264')) {
                    mimeType = 'video/mp4;codecs=h264';
                } else if (MediaRecorder.isTypeSupported('video/mp4')) {
                    mimeType = 'video/mp4';
                }

                const mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                const chunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: mimeType });
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.onerror = e => reject(e);
                    reader.readAsDataURL(blob);
                };

                video.play().then(() => {
                    mediaRecorder.start(100);
                    setTimeout(() => {
                        if (mediaRecorder.state !== "inactive") {
                            mediaRecorder.stop();
                        }
                        video.pause();
                        URL.revokeObjectURL(video.src);
                    }, cropDuration * 1000);
                }).catch(err => {
                    // Video otomatik oynatılamadıysa direkt orijinal dosyayı oku
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            };

            video.onerror = () => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            };
        });
    }

    function optimizeFile(file) {
        return new Promise((resolve, reject) => {
            const MAX_SIZE_MB = 8; // Güvenli Sınır (MB)

            if (file.type.startsWith('video/')) {
                if (file.size > MAX_SIZE_MB * 1024 * 1024) {
                    cropVideoFile(file, MAX_SIZE_MB).then(resolve).catch(reject);
                } else {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.onerror = e => reject(e);
                    reader.readAsDataURL(file);
                }
                return;
            }

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1280;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.onerror = e => reject(e);
            };
            reader.onerror = e => reject(e);
        });
    }

    async function yansit() {
        const note = document.getElementById('noteInput').value;
        const fileInput = document.getElementById('fileInput');
        const files = fileInput.files;
        const status = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');

        status.style.color = "#ffeb3b";
        status.innerText = "Medyalar işleniyor...";
        
        progressContainer.style.display = 'block';
        updateProgress(10, "Medyalar hazırlanıyor...");

        if (files.length === 0) {
            updateProgress(90, "Veri sunucuya gönderiliyor...");
            veriyiGonder(note, []);
            return;
        }

        let base64Files = [];
        try {
            for (let i = 0; i < files.length; i++) {
                updateProgress(20 + Math.round((i / files.length) * 60), `Medya ${i + 1}/${files.length} işleniyor...`);
                const dataUrl = await optimizeFile(files[i]);
                base64Files.push(dataUrl);
            }

            updateProgress(90, "Sunucuya aktarılıyor... (%90)");
            veriyiGonder(note, base64Files);
        } catch (error) {
            status.style.color = "#ff5252";
            status.innerText = "İşlem sırasında bir hata oluştu!";
            updateProgress(0, "");
        }
    }

    function updateProgress(percent, statusText) {
        const progressBar = document.getElementById('progressBar');
        const status = document.getElementById('status');
        progressBar.style.width = percent + '%';
        progressBar.innerText = '%' + percent;
        if (statusText) status.innerText = statusText;
    }

    function veriyiGonder(note, images) {
        const status = document.getElementById('status');

        db.ref('displayData').set({
            note: note,
            images: images,
            timestamp: Date.now()
        }, (error) => {
            if (error) {
                status.style.color = "#ff5252";
                status.innerText = "Hata oluştu! (Dosya boyutu yüksek olabilir)";
                updateProgress(0, "");
            } else {
                updateProgress(100, "Başarıyla TV Ekranına Yansıtıldı!");
                status.style.color = "#4CAF50";
                setTimeout(() => {
                    document.getElementById('progressContainer').style.display = 'none';
                }, 3000);
            }
        });
    }
</script>

</body>
</html>
