<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pano Yönetimi - Admin</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --primary: #6366f1;
      --text: #f3f4f6;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h2 {
      margin-bottom: 20px;
      font-weight: 600;
      color: var(--primary);
    }
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #a1a1aa;
    }
    select, input[type="text"], input[type="range"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #09090b;
      color: #fff;
      font-size: 0.95rem;
    }
    .range-val {
      float: right;
      color: var(--primary);
      font-weight: bold;
    }
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <h2>Dijital Pano Ayarları</h2>

  <div class="card">
    <h3>Slayt & Geçiş Ayarları</h3>
    <br>
    
    <!-- Slayt Süresi -->
    <div class="form-group">
      <label>
        Slayt Geçiş Süresi 
        <span class="range-val" id="duration-val">5 saniye</span>
      </label>
      <input type="range" id="duration" min="2" max="30" value="5" oninput="document.getElementById('duration-val').innerText = this.value + ' saniye'">
    </div>

    <!-- Geçiş Efekti -->
    <div class="form-group">
      <label>Geçiş Efekti Stili</label>
      <select id="effect">
        <option value="fade">Yumuşak Geçiş (Fade)</option>
        <option value="slide">Yana Kayma (Slide)</option>
        <option value="zoom">Yakınlaşma (Zoom)</option>
        <option value="kenburns">Ken Burns (Pan & Zoom)</option>
      </select>
    </div>

    <!-- Oynatma Sırası -->
    <div class="form-group toggle-group">
      <label for="shuffle">Fotoğrafları Karışık Oynat (Shuffle)</label>
      <input type="checkbox" id="shuffle" style="width: 20px; height: 20px;">
    </div>
  </div>

  <div class="card">
    <h3>Ekran İçeriği</h3>
    <br>
    
    <!-- Alt Kayar Yazı / Not -->
    <div class="form-group">
      <label>Alt Kayar Not / Duyuru Bandı</label>
      <input type="text" id="ticker" placeholder="Örn: Akşam saat 20:00'de spora gidilecek!">
    </div>
  </div>

  <button class="btn" onclick="saveSettings()">Ayarları TV'ye Gönder</button>

  <script>
    function saveSettings() {
      const settings = {
        interval: document.getElementById('duration').value * 1000,
        effect: document.getElementById('effect').value,
        shuffle: document.getElementById('shuffle').checked,
        tickerText: document.getElementById('ticker').value
      };

      console.log("Kaydedilen Ayarlar:", settings);
      alert("Ayarlar TV ekranına gönderildi!");
      
      // Buraya veritabanı veya WebSocket gönderme kodunu ekleyebilirsin.
    }
  </script>
</body>
</html>
